name: linux-vm
title: Linux virtual machine
catalog_type: app
categories: [virtual-machines, development]
category: app
vault: none
platforms: [deb]
types:
  - ../../resolvers/qemu/models/LinuxQemuVmResolverConfig.pipe
dependencies:
  host:
    - id: qemu
      command: qemu-system-x86_64
      description: Required to boot a Linux development guest through QEMU.
      install:
        deb: sudo apt-get install -y qemu-system-x86 qemu-utils
    - id: ssh
      command: ssh
      description: Required for SSH commands in prepared Linux guests. Manual installation does not connect over SSH; qualification disables it.
      install:
        deb: sudo apt-get install -y openssh-client
view:
  entry:
    type: choice
    field: General.BootSource
    title: Linux VM source
    description: Install Linux manually from an ISO, or boot a prepared disk.
    options:
      - value: image
        label: Boot existing disk image
        pages: [image, machine, qualification]
      - value: installer-iso
        label: Install from ISO
        pages: [install, machine, qualification]
  pages:
    - id: image
      title: Existing Linux disk
      description: Use a bootable disk. SSH commands require an existing guest account, SSH server, and operator-provided key authentication. Leave the SSH user empty to choose an interactive desktop.
      sections:
        - id: development-disk
          title: Disk and persistence
          fields: [Storage.Disk, Storage.Persistence]
        - id: guest-command
          title: SSH command
          fields: [General.ExecMode, Advanced.SshUser, Advanced.GuestCommand]
    - id: install
      title: Linux installer
      description: Installation is manual in the VM window. Changes always persist directly to the destination disk. Reusing a disk can replace its contents; disk size applies only to a new disk. Closing the VM ends this run without executing an SSH command.
      sections:
        - id: install-media
          title: Installer and destination
          fields: [Storage.InstallerIso, Storage.Disk, Storage.DiskSize]
    - id: machine
      title: Execution
      sections:
        - id: general
          title: Development guest
          fields: [General.Purpose, Advanced.NetDevice]
    - id: qualification
      title: Offline qualification contract
      description: These fields describe the separate offline qualification contract. The development launcher does not download or prepare an image from them. Qualification remains disabled.
      sections:
        - id: immutable-image
          title: Qualification image reference
          fields: [Image.Url, Image.Sha256, Image.Override]
        - id: identity
          title: Stable identities
          fields: [Qualification.Enabled, Qualification.Disposable, Qualification.MachineUuid, Qualification.DiskSerial, Qualification.RunId, Qualification.Scenario, Qualification.DurabilityBoundary]
        - id: protocol
          title: Mutual pinning
          fields: [Protocol.ControllerPublicKey, Protocol.GuestPublicKey, Protocol.HarnessSha256]
description: Install Linux manually from your ISO into a persistent disk, or boot a prepared Linux disk for interactive use or SSH commands.
runtime: vm
resolver: qemu
vars:
  DOCKPIPE_VM_GUEST_PREPARATION: provided-only
inputs:
  General.ExecMode: bash
  General.BootSource: image
  General.Purpose: development
  Storage.Persistence: ephemeral
  Storage.DiskSize: 64G
  Qualification.Enabled: false
steps:
  - id: guest-command
    cmd: >-
      if [ -n "${DOCKPIPE_VM_GUEST_COMMAND:-}" ]; then sh -ceu "$DOCKPIPE_VM_GUEST_COMMAND";
      else printf '%s\n' '[dockpipe] Connected to Linux development VM over SSH.'; id; hostname; fi
