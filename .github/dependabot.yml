# Version updates target dev. Security updates use the default branch (master)
# regardless of target-branch; qualify fixes through the protected branch flow.
version: 2
updates:
- package-ecosystem: gomod
  directory: /
  target-branch: dev
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: gomod
  directory: /packages/vm/tools
  target-branch: dev
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: github-actions
  directory: /
  target-branch: dev
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    actions:
      patterns:
      - '*'
- package-ecosystem: terraform
  directory: /packages/cloud/storage/resolvers/r2/dockpipe.cloudflare.r2infra/terraform
  target-branch: dev
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: /packages/agent/resolvers/claude/assets/images/claude
  target-branch: dev
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: /packages/agent/resolvers/codex/assets/images/codex
  target-branch: dev
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: /packages/agent/resolvers/ollama/assets/images/ollama
  target-branch: dev
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
