name: Native Guest Tools candidate

on:
  pull_request:
    branches: [dev]
    paths:
      - 'packages/vm/guest-tools/**'
      - 'tooling/bootstrap_dockpipe.py'
      - 'dockpipe.config.json'
      - 'dockpipe.lock.json'
      - '.github/workflows/guest-tools-candidate.yml'
  push:
    branches: [dev]
    paths:
      - 'packages/vm/guest-tools/**'
      - 'tooling/bootstrap_dockpipe.py'
      - 'dockpipe.config.json'
      - 'dockpipe.lock.json'
      - '.github/workflows/guest-tools-candidate.yml'

permissions:
  contents: read

concurrency:
  group: guest-tools-candidate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.7'
      - name: Verify material checkout and focused contract tests
        shell: pwsh
        run: |
          python -B -m unittest discover -s packages/vm/guest-tools/tests -p 'test_candidate*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire exact locked inputs and qualify native Windows delivery
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          python -B packages/vm/guest-tools/tooling/candidate_ci.py --source "$env:GITHUB_WORKSPACE" --work "$env:RUNNER_TEMP/guest-tools-native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-tools-native-candidate
          path: ${{ runner.temp }}/guest-tools-native/candidate/prepared/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'Dockpipe-Industries/dockpipe-packages' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest-tools-native-candidate
          path: ${{ runner.temp }}/guest-tools-candidate
      - name: Attest exact native delivery, source, toolchain and qualification records
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/guest-tools-candidate/assets/*
      - name: Create or resume immutable candidate and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B packages/vm/guest-tools/tooling/publish_candidate.py \
            --assets "$RUNNER_TEMP/guest-tools-candidate/assets" \
            --receipt "$RUNNER_TEMP/guest-tools-public-readback.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-tools-public-readback
          path: ${{ runner.temp }}/guest-tools-public-readback.json
          if-no-files-found: error
          retention-days: 7
